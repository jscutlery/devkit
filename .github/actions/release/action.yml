name: Release

description: Release packages

inputs:
  git_bot_token:
    description: Git bot token
    required: true

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    # Trusted publishing needs npm >= 11.5.1, cf. https://docs.npmjs.com/trusted-publishers
    - name: Update npm
      shell: bash
      run: npm install -g npm@^11.5.1 && npm --version

    - name: Release
      env:
        GITHUB_TOKEN: ${{ inputs.git_bot_token }}
      shell: bash
      run: npx --yes nx release --yes

    - name: hack remove 'swc-angular-{version}' tag until this is fixed https://github.com/nrwl/nx/issues/22798
      shell: bash
      run: git tag -d 'swc-angular-{version}' || true

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ inputs.git_bot_token }}
        branch: ${{ github.ref }}
        force: true
        tags: true
