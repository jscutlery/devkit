name: Release

description: Release packages

inputs:
  git_bot_token:
    description: Git bot token
    required: true

runs:
  using: composite
  steps:
    - name: Release
      env:
        GITHUB_TOKEN: ${{ inputs.git_bot_token }}
      shell: bash
      # nx release publishes with `pnpm publish`, which handles npm trusted publishing (OIDC) itself.
      run: pnpm nx release --yes

    - name: hack remove 'swc-angular-{version}' tag until this is fixed https://github.com/nrwl/nx/issues/22798
      shell: bash
      run: git tag -d 'swc-angular-{version}' || true

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ inputs.git_bot_token }}
        branch: ${{ github.ref }}
        force: true
        tags: true
