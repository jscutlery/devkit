name: Test & Release

on:
  push:
    branches:
      - main
  pull_request: { }
  # Releases are manual: run this workflow on main from the Actions tab.
  workflow_dispatch: { }

# Runs on main (merges and releases) queue instead of overlapping; PR runs stay independent.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: pnpm nx affected --target=build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm nx affected --target=lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test
        run: pnpm nx affected --target=test

  component-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
        with:
          cypress: 'true'
          playwright: 'true'
      - name: Component Test
        run: pnpm nx affected --target=component-test --parallel=1
      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
        with:
          cypress: 'true'
      - name: E2E
        run: pnpm nx affected --target=e2e --parallel=1

  release:
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    permissions:
      actions: read
      contents: read
      # npm trusted publishing (OIDC), cf. https://docs.npmjs.com/trusted-publishers
      id-token: write

    needs:
      - build
      - lint
      - test
      - component-test
      - e2e

    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
        with:
          git_bot_token: ${{ secrets.GIT_BOT_TOKEN }}
          node_version: '24'
      - name: Release
        uses: ./.github/actions/release
        with:
          git_bot_token: ${{ secrets.GIT_BOT_TOKEN }}
