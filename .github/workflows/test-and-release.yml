name: Test & Release

on:
  push:
    branches:
      - main
  pull_request: { }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: yarn nx affected --target=build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: yarn nx affected --target=lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test
        run: yarn nx affected --target=test

  component-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps
      - name: Component Test
        run: yarn nx affected --target=component-test --parallel=1
      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: E2E
        run: yarn nx affected --target=e2e --parallel=1

  release:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    permissions:
      actions: read
      contents: read
      # npm trusted publishing (OIDC), cf. https://docs.npmjs.com/trusted-publishers
      id-token: write

    needs:
      - build
      - lint
      - test
      - component-test
      - e2e

    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
        with:
          git_bot_token: ${{ secrets.GIT_BOT_TOKEN }}
          node_version: '24'
      - name: Release
        uses: ./.github/actions/release
        with:
          git_bot_token: ${{ secrets.GIT_BOT_TOKEN }}
